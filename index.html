<!DOCTYPE html>
<html>
<head>
    <title>Student To-Do App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="box">
    <h1>My To-Do List</h1>

    <input id="taskInput" placeholder="Enter task">
    <select id="priority">
        <option>High</option>
        <option>Medium</option>
        <option>Low</option>
    </select>
    <button id="addBtn">Add</button>

    <p id="stats">0 tasks</p>
    <ul id="list"></ul>
</div>

<script src="script.js"></script>
</body>
</html>
